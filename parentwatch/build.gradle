plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'ru.example.parentwatch'
    compileSdk 34

    defaultConfig {
        applicationId "ru.example.parentwatch"
        minSdk 26
        targetSdk 34
        versionCode rootProject.ext.cwVersionCode as int
        versionName rootProject.ext.cwVersionName as String

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // When a key exists, signing happens automatically: nobody has to remember to
    // pass anything, and a release cannot be published unsigned by accident.
    if (rootProject.ext.cwReleaseSigningReady) {
        signingConfigs {
            release {
                storeFile file(rootProject.ext.cwSigningKeyPath)
                storePassword rootProject.ext.cwSigningPassword
                keyAlias rootProject.ext.cwSigningAlias
                keyPassword rootProject.ext.cwSigningPassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // The same key as the release build, so a debug build installs over one
            // that already carries the permanent signature. Android refuses any
            // update whose signature differs, and mixing keys is how that happens.
            if (rootProject.ext.cwReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the project's permanent key when one is configured, so
            // this build can be installed over the one already on a phone.
            if (rootProject.ext.cwReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // When this build was made, so the application can show it on the main screen.
    defaultConfig {
        buildConfigField "String", "BUILD_STAMP",
            "\"${rootProject.ext.cwBuildDate} ${rootProject.ext.cwBuildTime}\""
    }

    // Room schema export location
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    // Lint options to fix build issues
    lint {
        abortOnError false
        checkReleaseBuilds false
        // Disable specific problematic checks
        disable 'LintError'
        disable 'InvalidPackage'
        warningsAsErrors false
        quiet true
    }
}

// Use the current Android Gradle Plugin API for a stable APK filename.
base {
    archivesName = "ChildDevice-v${rootProject.ext.cwVersionName}"
}

dependencies {
    implementation project(':shared-core')
    implementation project(':attention-android')
    implementation project(':design-system')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Location Services
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    
        // CameraX for remote photo capture
        def camerax_version = "1.3.0"
        implementation "androidx.camera:camera-core:${camerax_version}"
        implementation "androidx.camera:camera-camera2:${camerax_version}"
        implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    
    // OpenStreetMap (OSMdroid) - works in Russia without VPN
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.vanniktech:emoji-google:0.20.0'
    
    // Retrofit (for some NetworkClient features)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // WebSocket (Socket.IO)
    implementation 'io.socket:socket.io-client:2.1.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // QR Code generation
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Barcode scanning (for QR scanner)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Camera
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // Room Database
    // Room 2.7 supports the current Kotlin/KSP toolchain used by Android Studio.
    implementation 'androidx.room:room-runtime:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Installed-schema migration fixtures are packaged only in the instrumentation APK.
android.sourceSets.androidTest.assets.srcDirs += file("schemas")
