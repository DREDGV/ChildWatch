// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.3.1' apply false
    id 'com.android.library' version '9.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
    id 'com.google.devtools.ksp' version '2.3.2' apply false
    id 'com.google.gms.google-services' version '4.3.15' apply false
}

def versionBase = (findProperty("cwVersionBase") ?: "7.3").toString()
def buildMoment = new Date()
def codeStamp = (System.currentTimeMillis() / 1000L).toLong()
def nameStamp = buildMoment.format("yyDDD.HHmmss")

ext.cwVersionCode = (findProperty("cwVersionCode") ?: codeStamp).toString().toInteger()
ext.cwVersionName = (findProperty("cwVersionName") ?: "${versionBase}.${nameStamp}").toString()
// The moment of the build, published into the application so a phone can say which
// build it is running. The version name alone carries it in a compact form that
// nobody can read at a glance.
ext.cwBuildDate = buildMoment.format("dd.MM.yyyy")
ext.cwBuildTime = buildMoment.format("HH:mm")

// ---------------------------------------------------------------------------
// Release signing.
//
// A release build is signed with the project's permanent key, so an update can be
// installed over the application already on a phone. Android only accepts an
// update signed by the same key, which is why the key is created once and kept
// outside the repository.
//
// The password is never stored here. scripts\build-release.ps1 reads it from the
// encrypted file tied to the owner's Windows account and passes it in the
// environment for the length of one build, so the secret exists in memory only
// and never in a file a person or an agent can read.
//
// With no key configured the debug build still works; only signing a release
// requires it.
// ---------------------------------------------------------------------------
def signingSettingsPath = new File(
    System.getenv("LOCALAPPDATA") ?: "",
    "ChildWatch/signing.properties"
)
def signingKeyPath = null
def signingAlias = null
def signingPassword = System.getenv("CW_SIGNING_PASSWORD")

if (signingSettingsPath.isFile()) {
    signingSettingsPath.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed.startsWith("keyPath=")) { signingKeyPath = trimmed.substring(8).trim() }
        if (trimmed.startsWith("alias=")) { signingAlias = trimmed.substring(6).trim() }
    }
}

ext.cwReleaseSigningReady = signingKeyPath != null &&
    new File(signingKeyPath).isFile() &&
    signingAlias != null &&
    signingPassword != null &&
    !signingPassword.isEmpty()

ext.cwSigningKeyPath = signingKeyPath
ext.cwSigningAlias = signingAlias
ext.cwSigningPassword = signingPassword

// Optional isolated output directory for unattended/CI builds on Windows.
// Android Studio keeps using the regular module build directories unless the
// cwIsolatedBuildRoot property is explicitly supplied by the build script.
def isolatedBuildRoot = findProperty("cwIsolatedBuildRoot")?.toString()?.trim()
if (isolatedBuildRoot) {
    def isolatedRootDirectory = rootProject.file(isolatedBuildRoot)
    subprojects { subproject ->
        subproject.layout.buildDirectory.set(
            new File(isolatedRootDirectory, subproject.name)
        )
    }
}

tasks.register('printVersionInfo') {
    group = 'help'
    description = 'Shows resolved ChildWatch versionName/versionCode for this build session.'
    doLast {
        println "ChildWatch versionName=${ext.cwVersionName}"
        println "ChildWatch versionCode=${ext.cwVersionCode}"
    }
}

// Guard against broken encodings in source/resources.
// Default mode reports suspicious files without breaking the build.
// Use -Putf8GuardStrict=true to fail the task while the cleanup is in progress.
def utf8SuspiciousRegexes = [
    [~/Ã./, "latin1 utf8 mojibake"],
    [~/Ð./, "latin1 cyrillic mojibake"],
    [~/Ñ./, "latin1 cyrillic mojibake"],
    [~/�/, "replacement character"],
    [~/вЂ./, "cp1252 punctuation mojibake"],
    [~/рџ./, "emoji mojibake"],
    [~/(?:Р.|С.){3,}/, "double-decoded cyrillic mojibake"],
]

tasks.register('utf8Guard') {
    group = 'verification'
    description = 'Scans sources for suspicious mojibake patterns.'
    doLast {
        def strict = ((findProperty("utf8GuardStrict") ?: "false").toString()).toBoolean()
        def trees = []
        trees += fileTree('.') {
            include 'app/src/**/*.kt', 'app/src/**/*.java', 'app/src/**/*.xml'
            include 'parentwatch/src/**/*.kt', 'parentwatch/src/**/*.java', 'parentwatch/src/**/*.xml'
            include 'server/**/*.js', 'server/**/*.ts', 'server/**/*.json'
            exclude '**/build/**', '**/.gradle/**', '**/.git/**', '**/node_modules/**'
        }
        def bad = []
        trees.each { f ->
            def text = f.getText('UTF-8')
            def match = utf8SuspiciousRegexes.find { entry -> (text =~ entry[0]).find() }
            if (match != null) {
                bad << "${f} [${match[1]}]"
            }
        }
        if (!bad.isEmpty()) {
            def message = "Potential encoding issues found in files:\n" +
                bad.join('\n') +
                "\nRun with -Putf8GuardStrict=true to fail the build."
            if (strict) {
                throw new GradleException(message)
            }
            logger.warn(message)
        } else {
            println 'UTF-8 guard passed.'
        }
    }
}

// Keep the report visible in the common verification cycle.
tasks.matching { it.name == 'check' }.configureEach {
    dependsOn tasks.named('utf8Guard')
}
