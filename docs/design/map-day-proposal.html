<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChildWatch · День на карте — предложение</title>
<style>
:root{--primary:#126C67;--container:#CDEDEA;--bg:#F6FAF9;--text:#171D1C;--muted:#3F4947;--outline:#BEC9C6;--blue:#1E74E8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:540px;margin:auto;background:white;min-height:100vh}header,section{padding:16px}header{border-bottom:1px solid var(--outline)}h1{font-size:24px;margin:4px 0 12px}p{line-height:1.45;margin:8px 0}.note{font-size:13px;color:var(--muted)}button,select,input{font:inherit;min-height:48px;border:1px solid var(--outline);border-radius:12px;padding:8px 12px;background:white;color:var(--text)}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button.active{background:var(--container);border-color:var(--primary);color:var(--primary)}.map{position:relative;background:#F1F5F3;padding:0}.map svg{display:block;width:100%;height:240px}.badge{position:absolute;left:16px;top:12px;background:white;border-radius:8px;padding:8px;font-size:13px}.time{font-size:24px;font-weight:600;margin-top:8px}.slider{width:100%;padding:0;accent-color:var(--primary)}.events{padding-top:0}.events button{width:100%;display:block;text-align:left;border:0;border-radius:0;border-top:1px solid var(--outline);padding:14px 4px;line-height:1.4}.events small{display:block;color:var(--muted);font-size:13px}.gap{background:#F6FAF9}.status{min-height:70px}#play{flex:1.4}.stats{font-size:13px;color:var(--muted);padding-top:0}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.panelActions{display:flex;justify-content:space-between;gap:8px;padding:12px 16px 0}.panelCollapsed #position,.panelCollapsed #controls>.row,.panelCollapsed #stats,.panelCollapsed #events{display:none}.liveMode .map svg{height:calc(100vh - 245px);min-height:300px}#showPanel{margin:12px 16px}
</style><main>
<header><p class="note">Предложение интерфейса · вымышленные данные и схема карты</p><h1>День на карте</h1><div class="row"><select id="person" aria-label="Человек"><option>Ребёнок (пример)</option><option>Мама (пример)</option></select><input id="day" type="date" value="2026-10-02" max="2026-10-02" aria-label="День маршрута"></div><p id="context" class="note">Время телефона родителя · UTC+7</p><div class="row"><button class="active" id="history">История</button><button id="live">Сейчас</button></div></header>
<div class="map"><span class="badge" id="mode">История · 2 октября</span><svg viewBox="0 0 390 240" role="img" aria-label="Два подтверждённых участка маршрута; промежуток между ними не соединён"><path d="M0 70H390 M0 175H390 M85 0V240 M290 0V240" stroke="white" stroke-width="22"/><rect x="125" y="15" width="100" height="38" rx="6" fill="#CDEDEA"/><text x="155" y="39" font-size="13" fill="#3F4947">Парк</text><text x="18" y="207" font-size="13" fill="#3F4947">Дом</text><text x="310" y="42" font-size="13" fill="#3F4947">Школа</text><g id="routes"><polyline points="40,175 85,175 85,115" fill="none" stroke="white" stroke-width="9"/><polyline points="40,175 85,175 85,115" fill="none" stroke="#1E74E8" stroke-width="5" stroke-linejoin="round"/><polyline points="180,70 290,70 290,35" fill="none" stroke="white" stroke-width="9"/><polyline points="180,70 290,70 290,35" fill="none" stroke="#1E74E8" stroke-width="5" stroke-linejoin="round"/></g><g id="cursor"><circle r="13" fill="white"/><circle r="9" fill="#126C67"/></g></svg></div>
<button id="showPanel" hidden>Показать историю</button><div id="historyPanel"><div class="panelActions"><button id="fold">Свернуть</button><button id="hidePanel">Скрыть</button></div><section id="controls"><div class="status" aria-live="polite"><div class="time" id="time">07:40</div><p id="detail">Дом · первая точка дня</p></div><input class="slider" id="position" type="range" min="0" max="6" value="0" aria-label="Время на маршруте"><div class="row"><button id="prev" aria-label="Предыдущее измерение">Назад</button><button id="play">Просмотреть путь</button><button id="next" aria-label="Следующее измерение">Дальше</button></div></section>
<section class="stats" id="stats">Измеренные участки ≈1,2 км · есть пропуск 07:48–07:56.<br>Это не весь пройденный путь за день.</section><section class="events" id="events"><button data-index="0">07:40 · Дом<small>Первая координата дня; уход не подтверждён</small></button><button data-index="1">07:44–07:48 · Движение<small>Нажмите, чтобы посмотреть этот участок</small></button><button data-index="3" class="gap">07:48–07:56 · Нет надёжных координат<small>Местоположение в этом промежутке неизвестно</small></button><button data-index="4">07:56–08:02 · Движение<small>Продолжение после пропуска</small></button><button data-index="6">08:02 · Возле школы<small>Точка рядом с местом; событие прибытия требует подтверждения</small></button></section></div>
</main><script>
const $=id=>document.getElementById(id);const fixes=[['07:40',40,175,'Дом · точность ±12 м'],['07:44',85,175,'Измеренная скорость 4,2 км/ч · точность ±9 м'],['07:48',85,115,'Последняя точка перед пропуском · точность ±15 м'],['07:52',null,null,'Нет надёжных координат. Точку на карте не показываем.'],['07:56',180,70,'Первая точка после пропуска · точность ±18 м'],['08:00',290,70,'Измеренная скорость 4,5 км/ч · точность ±10 м'],['08:02',290,35,'Возле школы · точность ±12 м']];let timer=null;let live=true;let panelOpen=true;let folded=false;function stop(){clearInterval(timer);timer=null;$('play').textContent='Просмотреть путь'}function render(){let point=fixes[Number($('position').value)];$('time').textContent=live?'Сейчас':point[0];$('detail').textContent=live?'Последняя точка 08:02 · это демонстрация':point[3];$('cursor').style.display=point[1]===null&&!live?'none':'';$('cursor').setAttribute('transform',`translate(${live?290:point[1]},${live?35:point[2]})`);$('routes').style.display=live?'none':'';$('controls').querySelectorAll('button,input').forEach(el=>el.disabled=live);$('events').hidden=live;$('stats').hidden=live;$('history').classList.toggle('active',!live);$('live').classList.toggle('active',live);$('historyPanel').hidden=live||!panelOpen;$('showPanel').hidden=live||panelOpen;document.body.classList.toggle('liveMode',live);document.body.classList.toggle('panelCollapsed',folded);$('fold').textContent=folded?'Развернуть':'Свернуть';$('mode').textContent=live?'Сейчас · демонстрация':`История · ${$('day').value}`}
$('position').oninput=()=>{stop();render()};$('prev').onclick=()=>{stop();$('position').value=Math.max(0,+$('position').value-1);render()};$('next').onclick=()=>{stop();$('position').value=Math.min(6,+$('position').value+1);render()};$('play').onclick=()=>{if(timer){stop();return}if(+$('position').value>=6)$('position').value=0;timer=setInterval(()=>{$('position').value=+$('position').value+1;render();if(+$('position').value===3||+$('position').value>=6)stop()},900);$('play').textContent='Пауза'};document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{stop();$('position').value=b.dataset.index;render()});$('live').onclick=()=>{stop();live=true;render()};$('history').onclick=()=>{live=false;panelOpen=true;render()};$('person').onchange=()=>{stop();$('position').value=0;render()};$('day').onchange=()=>{stop();$('position').value=0;render();$('context').textContent='Демонстрационный маршрут одинаков для выбранных дат · UTC+7'};$('fold').onclick=()=>{stop();folded=!folded;render()};$('hidePanel').onclick=()=>{stop();panelOpen=false;render()};$('showPanel').onclick=()=>{panelOpen=true;render()};render();
</script></html>
